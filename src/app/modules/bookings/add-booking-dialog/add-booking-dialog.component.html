<div class="dialog-header">
    <h2>Add Booking</h2>
    <button mat-icon-button class="close-btn" (click)="close()">
        <mat-icon>close</mat-icon>
    </button>
</div>

<div class="dialog-content">
    <form #bookingForm="ngForm">
        <div class="form-grid">

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>FirstName</mat-label>
                <input matInput [(ngModel)]="newBooking.firstName" name="firstName" placeholder="FirstName" required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>LastName</mat-label>
                <input matInput [(ngModel)]="newBooking.lastName" name="lastName" placeholder="LastName" required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Phone Number</mat-label>
                <input matInput type="number" [(ngModel)]="newBooking.mobileNumber" name="mobileNumber"
                    placeholder="Phone Number" required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Email</mat-label>
                <input matInput [(ngModel)]="newBooking.email" name="email" placeholder="Email">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Address 1</mat-label>
                <input matInput [(ngModel)]="newBooking.address1" name="address1" placeholder="Address 1" required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Address 2</mat-label>
                <input matInput [(ngModel)]="newBooking.address2" name="address2" placeholder="Address 2">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>City</mat-label>
                <input matInput [(ngModel)]="newBooking.city" name="city" placeholder="City" required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>State</mat-label>
                <input matInput [(ngModel)]="newBooking.state" name="state" placeholder="State" required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>ID Number</mat-label>
                <input matInput [(ngModel)]="newBooking.idNumber" name="idNumber" placeholder="ID Number" required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Pincode</mat-label>
                <input matInput [(ngModel)]="newBooking.pinCode" name="pinCode" placeholder="Pincode" required>
            </mat-form-field>
        </div>

        <div style="margin: 0 24px;">
            <div class="upload-line" (click)="fileInput.click()" (dragover)="onDragOver($event)"
                (dragleave)="onDragLeave($event)" (drop)="onDrop($event)" [class.dragging]="isDragging">
                <mat-icon>upload</mat-icon>
                <span>Drag & drop image or click to upload (PNG/JPG · Max 1MB)</span>

                <input #fileInput type="file" hidden accept="image/png,image/jpeg" (change)="onFileSelect($event)" />
            </div>

            <div *ngIf="previewUrl" class="preview">
                <img [src]="previewUrl" />

                <button mat-icon-button class="remove-btn" (click)="removeFile()">
                    <mat-icon>close</mat-icon>
                </button>
            </div>
        </div>


    </form>
</div>

<div class="action-btn" mat-dialog-actions align="end">
    <button mat-stroked-button (click)="close()">Cancel</button>
    <button mat-raised-button color="primary" (click)="saveBooking()" [disabled]="bookingForm.invalid || isSaving">Save</button>
</div>
