<div class="ft-container-spinner" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
</div>

<div class="filter-bar mat-elevation-z2 no-print">
    <div class="date-filter">
        <mat-form-field appearance="outline">
            <mat-label>From Date</mat-label>
            <input matInput [matDatepicker]="fromPicker" [(ngModel)]="fromDate">
            <mat-datepicker-toggle matSuffix [for]="fromPicker"></mat-datepicker-toggle>
            <mat-datepicker #fromPicker></mat-datepicker>
        </mat-form-field>

        <!-- To Date -->
        <mat-form-field appearance="outline">
            <mat-label>To Date</mat-label>
            <input matInput [matDatepicker]="toPicker" [(ngModel)]="toDate">
            <mat-datepicker-toggle matSuffix [for]="toPicker"></mat-datepicker-toggle>
            <mat-datepicker #toPicker></mat-datepicker>
        </mat-form-field>
    </div>

    <div class="search-btns">
        <button mat-raised-button color="primary" (click)="loadClients()">
            Search
        </button>

        <button mat-stroked-button color="secondary" (click)="resetFilters()">
            Reset
        </button>
    </div>
</div>

<div class="table-container">
    <div class="table-header">
        <h3>Customers</h3>
        <div class="pos-relative custom-search">
            <mat-icon class="prefix-search-icon" matPrefix>search</mat-icon>
            <input class="custom-search-box" autocomplete="off" matInput placeholder="Search" [(ngModel)]="inputValue"
                (keyup)="applyFilter($event)" />
            <mat-icon class="suffix-search-icon" *ngIf="inputValue?.length;" (click)="clear()"
                matSuffix>clear</mat-icon>
        </div>
    </div>

    <div class="table-wrapper mat-elevation-z4">
        <table mat-table [dataSource]="dataSource" matSort>

            <!-- Select -->
            <ng-container matColumnDef="bookingId">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
                <td mat-cell *matCellDef="let row">{{ row.id }}</td>
            </ng-container>

            <!-- Name -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                <td mat-cell *matCellDef="let row">
                    {{ getFullName(row) | titlecase }}
                </td>
            </ng-container>

            <!-- Email -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
                <td mat-cell *matCellDef="let row">
                    <mat-icon *ngIf="row.email" class="icon mail">mail</mat-icon>
                    {{ row.email }}
                </td>
            </ng-container>

            <!-- Mobile -->
            <ng-container matColumnDef="mobileNumber">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Mobile</th>
                <td mat-cell *matCellDef="let row">
                    <mat-icon class="icon phone">phone</mat-icon>
                    {{ row.mobileNumber }}
                </td>
            </ng-container>

            <!-- idNumber -->
            <ng-container matColumnDef="idNumber">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>ID Number</th>
                <td mat-cell *matCellDef="let row">
                    {{ row.idNumber }}
                </td>
            </ng-container>

            <!-- idNumber -->
            <ng-container matColumnDef="address1">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Address</th>
                <td mat-cell *matCellDef="let row">
                    {{ row.address1 }}
                </td>
            </ng-container>

            <!-- city -->
            <ng-container matColumnDef="city">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>City</th>
                <td mat-cell *matCellDef="let row">
                    {{ row.city }}
                </td>
            </ng-container>

            <!-- idNumber -->
            <ng-container matColumnDef="state">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>State</th>
                <td mat-cell *matCellDef="let row">
                    {{ row.state }}
                </td>
            </ng-container>



            <!-- ACTIONS COLUMN -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Actions </th>

                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
                        <mat-icon>more_vert</mat-icon>
                    </button>

                    <mat-menu #menu="matMenu" class="custom-context-menu">
                        <!-- <button mat-menu-item (click)="view(row)">
                            <mat-icon>visibility</mat-icon>
                            <span>View</span>
                        </button> -->

                        <button mat-menu-item (click)="editClient(row)">
                            <mat-icon>edit</mat-icon>
                            <span>Edit</span>
                        </button>

                        <!-- <button mat-menu-item (click)="deleteClient(row)">
                            <mat-icon>delete</mat-icon>
                            <span>Delete</span>
                        </button> -->
                    </mat-menu>
                </td>
            </ng-container>


            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 50]" showFirstLastButtons>
        </mat-paginator>
    </div>
</div>
